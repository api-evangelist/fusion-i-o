name: Fusion I/O
description: 'Fusion-io (branded Fusion I/O) was an enterprise storage company founded in 2005
  and based in the Salt Lake City area of Utah, best known for its ioMemory and ioDrive PCIe
  flash acceleration cards that placed NAND flash directly on the server bus to speed databases
  and data-center workloads. Steve Wozniak served as chief scientist; the company listed on the
  NYSE in 2011 and was acquired by SanDisk in 2014, later becoming part of Western Digital. It
  exposes no public API, developer portal, or documentation surface today; fusionio.com no longer
  resolves to a live site. Retained in the network as a defunct a16z portfolio company for record.'
